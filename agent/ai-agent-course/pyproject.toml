authors = [
    { name = "wanggang2", email = "wanggang2@yxt.wecom.work" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3,<1.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4,<0.5",
    "langchain-core>=1.5,<1.6",
    "langchain-openai>=1.5,<1.6",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-supervisor>=0.0.31",
    "langgraph-swarm>=0.1.0",
    "lxml>=6.1.3",
    "psycopg[binary,pool]>=3.3.7",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-agent-course = "ai_agent_course:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
