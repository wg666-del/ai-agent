[project]
name = "ai-agent-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wanggang2", email = "wanggang2@yxt.wecom.work" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.13",
    "langchain-openai>=1.7.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-agent-course = "ai_agent_course:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
